name: Build iPhone IPA
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install project generator
        run: brew install xcodegen
      - name: Build unsigned device app
        run: |
          xcodegen generate
          xcodebuild -project PocketLaunch.xcodeproj -scheme PocketLaunch -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/PocketLaunch.app Payload/
          zip -qry PocketLaunch.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: PocketLaunch-unsigned
          path: PocketLaunch.ipa
