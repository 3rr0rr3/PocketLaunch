name: Build iPhone IPA
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install project generator
        run: brew install xcodegen
      - name: Prepare automatic game artwork
        run: python3 Scripts/build_artwork_index.py
      - name: Test IPA icon extraction
        run: swift test
      - name: Build unsigned device app
        run: |
          xcodegen generate
          xcodebuild -project PocketLaunch.xcodeproj -scheme PocketLaunch -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          test -f build/Build/Products/Release-iphoneos/PocketLaunch.app/artwork-index.json
          test -f build/Build/Products/Release-iphoneos/PocketLaunch.app/010095300B6A4000.jpg
          python3 Scripts/check_branding.py
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/PocketLaunch.app Payload/
          zip -qry IphoneSwitch.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: IphoneSwitch-unsigned
          path: IphoneSwitch.ipa
      - name: Verify automatic artwork on iPhone simulator
        timeout-minutes: 15
        run: python3 Scripts/check_automatic_artwork.py
      - uses: actions/upload-artifact@v4
        with:
          name: automatic-artwork-preview
          path: |
            automatic-artwork-preview.png
            ipa-library-preview.png
      - uses: actions/upload-artifact@v4
        with:
          name: clean-cartridge-animation
          path: |
            clean-cartridge-animation.mp4
            clean-cartridge-start.png
            clean-cartridge-finish.png
