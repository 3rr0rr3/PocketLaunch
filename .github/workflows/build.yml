name: Preview clean launch card
on:
  push:
  workflow_dispatch:
jobs:
  preview:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Prepare native animation
        run: |
          brew install xcodegen
          python3 Scripts/build_artwork_index.py
          xcodegen generate
      - name: Render existing animation with option 2 screen
        timeout-minutes: 15
        run: python3 Scripts/check_automatic_artwork.py
      - uses: actions/upload-artifact@v4
        with:
          name: option-2-animation-preview
          path: |
            clean-cartridge-animation.mp4
            clean-cartridge-start.png
            clean-cartridge-finish.png
